music_queries:
- 가야금/대금/해금 같은 한국 전통악기 느낌
- 비장하고 슬픈 톤
- 60~80 BPM (느림)
- 보컬 없음
- 1분 이상 길이 (20초만 사용)
- '"japanese sad traditional" — 일본 전통음악이지만 분위기 비슷'
- '"chinese guzheng emotional" — 중국 고쟁'
- '"epic sad orchestral" — 서양 오케스트라지만 비장미 OK'
- 트렌디한 힙합/팝 비트
- 패션 광고 느낌
- 100~130 BPM (빠름)
- 보컬 없거나 최소
- 10초 이상 길이 (10초 사용)
- '"trap beat short"'
- '"kpop instrumental"'
- '"fashion show background"'
sfx_queries:
- 깊고 묵직한 "쿵" — 영화 타이틀 카드 등장 시 같이 나오는 임팩트
- 0.5~1.5초 길이
- 베이스가 깊으면 좋음 (서브우퍼 느낌)
- 'BGM: `volume={0.5}` 정도 (자막 대사 안 들리니 너무 크면 안 됨)'
- 'SFX: `volume={0.8~1.0}` (강조 효과)'
- AI 제작 캡처는 **이미지·영상 생성 단계**만 필요 (음악은 다운로드만 한 것이라 AI 생성 아님)
- Pixabay 다운로드 페이지 스크린샷 정도만 보관 (저작권 증빙용)
