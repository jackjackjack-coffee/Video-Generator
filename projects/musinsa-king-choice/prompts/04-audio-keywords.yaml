# Music-only keyword file (s04_audio → pixabay adapter).
#
# SFX is no longer sourced here: diegetic SFX (footsteps, door close, ambience) comes
# from Veo native audio on the cut clips, and the single non-diegetic title-card "쿵"
# impact is a bundled asset at remotion/public/sfx-bundled/impact.mp3.
#
# Two beds are needed (see storyboard.yaml `music:` block for timing/volume):
#   1) 0–20s  : 비장하고 슬픈 한국 전통 톤 (가야금/대금/해금)
#   2) 20–28s : 트렌디한 힙합/패션쇼 비트
#
# Each line under `music_queries` is fed verbatim to the Pixabay music API, so keep them
# to real search strings only. Hand-curated YouTube Audio Library tracks (no API) go in
# remotion/public/music-manual/ and are referenced by filename in storyboard.yaml.

music_queries:
- japanese sad traditional
- chinese guzheng emotional
- epic sad orchestral
- trap beat short
- kpop instrumental
- fashion show background

# Non-query guidance (ignored by the loader — kept for the human picking tracks):
notes:
  historical_bed:
  - 가야금/대금/해금 같은 한국 전통악기 느낌, 비장하고 슬픈 톤
  - 60~80 BPM (느림), 보컬 없음, 1분 이상 길이 (20초만 사용)
  fashion_bed:
  - 트렌디한 힙합/팝 비트, 패션 광고 느낌
  - 100~130 BPM (빠름), 보컬 없거나 최소, 10초 이상 길이 (8초 사용)
  licensing:
  - 음악은 다운로드만 한 것이라 AI 생성 아님 (AI 제작 캡처는 이미지·영상 생성 단계만 필요)
  - Pixabay 다운로드 페이지 스크린샷 정도만 보관 (저작권 증빙용)

