# Pixabay search queries for the music / SFX stage (s04_audio).
#
# Only `music_queries` and `sfx_queries` are consumed by the pixabay adapter
# (see creativeforge/pipeline.py:_resolve_items). Each entry is sent verbatim as
# a Pixabay search term, so it must be a *real query* — not a BPM/length/mixing
# note. Human guidance lives under `notes:` and is intentionally ignored by the
# pipeline.

music_queries:
  # 사극 파트 (cut01–cut05): 비장한 한국/동양 전통 분위기
  - korean traditional instrument
  - gayageum daegeum
  - "japanese sad traditional"
  - "chinese guzheng emotional"
  - "epic sad orchestral"
  # 현대 파트 (cut06–cut09): 트렌디한 패션 광고
  - "trap beat short"
  - "kpop instrumental"
  - "fashion show background"

sfx_queries:
  - deep cinematic boom impact
  - subwoofer bass hit

# --- Human guidance only. NOT used as search queries. ---
# Original mixed-in notes from prompts/03-pixabay-keywords.md, preserved verbatim
# so the creative intent isn't lost when picking among Pixabay results.
notes:
  music:
    - 비장하고 슬픈 톤
    - 60~80 BPM (느림)
    - 보컬 없음
    - 1분 이상 길이 (20초만 사용)
    - 트렌디한 힙합/팝 비트
    - 패션 광고 느낌
    - 100~130 BPM (빠름)
    - 보컬 없거나 최소
    - 10초 이상 길이 (10초 사용)
  sfx:
    - 깊고 묵직한 "쿵" — 영화 타이틀 카드 등장 시 같이 나오는 임팩트
    - 0.5~1.5초 길이
    - 베이스가 깊으면 좋음 (서브우퍼 느낌)
  mixing:
    - 'BGM: volume={0.5} 정도 (자막 대사 안 들리니 너무 크면 안 됨)'
    - 'SFX: volume={0.8~1.0} (강조 효과)'
  process_doc:
    - AI 제작 캡처는 이미지·영상 생성 단계만 필요 (음악은 다운로드만 한 것이라 AI 생성 아님)
    - Pixabay 다운로드 페이지 스크린샷 정도만 보관 (저작권 증빙용)

raw_source: prompts/03-pixabay-keywords.md (Musinsa-ad-festival)
