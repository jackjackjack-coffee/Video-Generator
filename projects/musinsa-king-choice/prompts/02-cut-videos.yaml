# Per-cut video model allocation under the 1000-credit monthly budget.
#   veo-3.1-high-quality = 100 cr/video   (final polish of hero cuts)
#   veo-3.1-fast         =  20 cr/video   (draft pass — everything starts here)
#   veo-3.1-lite         =  10 cr/video
#   omni-flash           =  duration-based (4s:15 6s:20 8s:25 10s:30)
# source: flow (default, draws from the 1000 pool) | gemini (separate Omni pool)
#
# DRAFT-FIRST WORKFLOW (chosen to avoid burning 100 cr on an unseen prompt):
#   Pass 1 — draft: all 9 cuts on veo-3.1-fast = 9 x 20 = 180 cr. Run the stage,
#            review every clip at the approval gate, fix prompts and regen until
#            the content/composition is right.
#   Pass 2 — polish: once approved, flip the ~5 HERO cuts back to
#            veo-3.1-high-quality (~500 cr) and regen ONLY those via the gate's
#            [r] key or `creativeforge run musinsa-king-choice --only s02_cut_videos`.
#   Worst-case total ~680 cr — comfortably under the 1000 budget.
# Run `creativeforge credits musinsa-king-choice` to see the live budget breakdown.
defaults:
  aspect_ratio: 9:16
items:
  cut01:
    label: 수양대군 등장
    style: drama
    model: veo-3.1-fast   # HERO — upgrade to veo-3.1-high-quality for the final polish pass (opening hook)
    variants: 1
    duration_s: 3
    source: flow
    references:
    - cut01
    prompt: "Slow cinematic push-in camera movement toward Prince Suyang's face. He\nstands still and intimidating in the palace throne hall, his eyes\nslowly turning to look directly at camera. Background
      guards remain\nmotionless. Dust particles drift slowly in the dramatic side lighting.\nSubtle wind movement in his robe. Ambient sound only — distant low\ndrum and faint wind, no dialogue. Tense,
      ominous mood. Cinematic 9:16\nvertical, historical Korean drama style, photorealistic."
  cut02:
    label: 단종·신하 무릎
    style: drama
    model: veo-3.1-fast
    variants: 1
    duration_s: 3
    source: flow
    references:
    - cut02
    prompt: "Slow gentle camera push-in toward young King Danjong's tearful face. A\nsingle tear slowly rolls down his cheek. His lips tremble slightly,\neyes blinking heavy with sorrow. In the soft-focus
      background, court\nattendants remain kneeling and bowing, one of them shoulders shaking\nsubtly from quiet weeping. Warm candlelight flickers gently. Ambient\nsound only — soft breathing and faint
      distant traditional Korean\nstring instrument, no dialogue. Heartbreaking, somber atmosphere.\nCinematic 9:16 vertical, historical Korean drama, photorealistic."
  cut03:
    label: 수양 위협 대사
    style: drama
    model: veo-3.1-fast
    variants: 1
    duration_s: 4
    source: flow
    references:
    - cut03
    prompt: "Steady medium shot of Prince Suyang speaking authoritatively. He\ngestures with his raised hand, lowering it slowly as he speaks, then\ntakes one menacing step forward toward camera. His expression\n\
      intensifies — eyes narrowing, jaw set. The folding screen and red\npillars in background stay still. Strong directional light creates\nmoving shadows on his face as he moves. Ambient palace sound
      only —\nsubtle echo, no spoken dialogue (mouth movement natural but\nnon-specific). Tense, intimidating mood. Cinematic 9:16 vertical,\nhistorical Korean drama, photorealistic."
  cut04:
    label: 단종-수양 대화 + 수하 보고
    style: drama
    model: veo-3.1-fast
    variants: 1
    duration_s: 4
    source: flow
    references:
    - cut04
    prompt: "Wide static two-shot establishing the throne room. After 2 seconds, a\nJoseon military officer in armor rushes in through the palace doors in\nthe background, kneels on one knee, and bows his
      head in a quick\nreport gesture. Suyang slowly turns his head toward the officer with a\nsatisfied expression while Danjong's face falls in despair. Camera\nremains steady. Ambient sound only — footsteps
      approaching, faint\narmor clanking, no dialogue. Tense political atmosphere with golden\nhour light filtering through the doors. Cinematic 9:16 vertical,\nhistorical Korean drama, photorealistic."
  cut05:
    label: 단종 무진장 절규
    style: drama
    model: veo-3.1-fast   # HERO — upgrade to veo-3.1-high-quality for the final polish pass (emotional climax, the "무진장" line)
    variants: 1
    duration_s: 3
    source: flow
    references:
    - cut05
    prompt: "Extreme close-up of young King Danjong's face. A large glistening tear\nslowly forms and rolls down his cheek in slow motion. His mouth opens\nwide in an emotional cry, eyes squeezing shut
      briefly then opening\nagain wider. Subtle camera shake for dramatic effect. The candlelight\nflickers on his face. Ambient sound only — soft sobbing breath, no\nclear dialogue (mouth shape can suggest
      the Korean word\n\"mujinjang\"). Heartbreaking, almost comedic-tragic atmosphere.\nCinematic 9:16 vertical, extreme close-up, photorealistic."
  cut06:
    label: 변신 시퀀스
    style: fashion
    model: veo-3.1-fast   # HERO — upgrade to veo-3.1-high-quality for the final polish pass (transformation reveal)
    variants: 1
    duration_s: 3
    source: flow
    references:
    - cut06
    prompt: "Playful whimsical shot inside the palace room. The traditional folding\nscreen (byeongpung) rises smoothly upward, revealing behind it the\nsilhouette of King Danjong quickly changing clothes
      — quick humorous\nsilhouette motion of arms going up and down. The palace maid stands to\nthe side smiling, holding out modern streetwear. After 2 seconds, the\nscreen lowers back down. Subtle sparkle
      particles in the air. Bright\nwarm light, light comedic tone. Ambient sound only — soft fabric\nrustling and gentle magical chime, no dialogue. Cinematic 9:16\nvertical, photorealistic with whimsical
      mood."
  cut07:
    label: 단종 현대 패션 선포
    style: fashion
    model: veo-3.1-fast   # HERO — upgrade to veo-3.1-high-quality for the final polish pass (fashion declaration, Musinsa brand moment)
    variants: 1
    duration_s: 3
    source: flow
    references:
    - cut07
    prompt: "Confident medium shot of young King Danjong wearing modern streetwear\n(cream oversized hoodie, black cargo pants, white sneakers) and\ntraditional royal crown. He stands tall, then makes a
      subtle \"whatever\nyou want\" hand gesture — flicking his wrist casually. His eyes are\nstill slightly red but his expression is calm, slightly smirking. A\ngentle rim light catches his outline. Background
      palace stays in soft\nfocus. Ambient sound only — subtle fabric movement, faint modern beat\nhint, no dialogue. Playful, cool atmosphere blending old and new.\nCinematic 9:16 vertical, fashion editorial
      meets historical drama,\nphotorealistic."
  cut08:
    label: 수양 충격·무릎
    style: fashion
    model: veo-3.1-fast
    variants: 1
    duration_s: 2
    source: flow
    references:
    - cut08
    prompt: "Dramatic shot of Prince Suyang dropping to his knees in slow motion,\nboth hands hitting the wooden palace floor in a deep bow. His mouth\nfalls open in awe, eyes wide and glistening with a
      tear. His robe\nbillows as he kneels. Strong backlit dramatic lighting creating a\nhalo effect around him. Slight camera push-in synchronized with his\nmovement. Ambient sound only — heavy thud of
      knees on wood, gasping\nbreath, no dialogue. Overwhelmed, awestruck mood with subtle comedic\novertone. Cinematic 9:16 vertical, historical Korean drama,\nphotorealistic."
  cut09:
    label: 조정 → 궁문 행진 + 문 닫힘 (3초) ⭐ NEW
    style: fashion
    model: veo-3.1-fast   # HERO — upgrade to veo-3.1-high-quality for the final polish pass (epic finale, last shot before title card)
    # EXTEND CANDIDATE — one continuous take (march → gate closing). If 3s is too
    # short or you want a longer hold on the closing doors, Extend the base clip
    # rather than re-rolling. See CLAUDE.md "Extend vs. fresh generation".
    variants: 1
    duration_s: 3
    source: flow
    references:
    - cut09
    prompt: "Epic cinematic wide tracking shot from a low angle. King Danjong\n(young Korean boy in modern streetwear and traditional black silk\ncrown) walks slowly and confidently in slow motion down
      the red\ncarpet of a grand Joseon palace courtyard, leading the procession.\nA few steps behind him, Prince Suyang and several court officials in\ncolorful traditional Joseon robes follow with respectful
      posture,\nwalking at normal speed (creating dramatic time contrast with the\nslow-motion Danjong). The camera tracks alongside them, slowly\npulling back. They approach a massive Korean palace gate
      at the far\nend of the courtyard. As Danjong walks past the camera and through\nthe gate, the camera lingers as the gate's tall heavy wooden double\ndoors slowly begin to close from both sides. The
      final frame shows\nthe doors almost fully closed, with a thin sliver of the Mujinjang\nbanner still visible through the closing gap. The multiple Mujinjang\nKV flags visible in the reference image
      sway gently in the wind\nthroughout the courtyard. Dramatic golden hour sunlight, long shadows, soft lens\nflare. Ambient sound only — slow rhythmic footsteps, faint distant\ncrowd murmur, deep heavy
      wooden door creaking and closing thud at\nthe very end (this thud will be reinforced by the title card impact\nsound). No dialogue. Epic fashion-meets-history atmosphere.\nCinematic 9:16 vertical,
      slow motion on Danjong, photorealistic."
raw_source: prompts/02-*.md (Musinsa-ad-festival)
