[project]
name = "creativeforge"
version = "0.1.0"
description = "Multi-project AI video production pipeline with pluggable adapters and stage-gated approval"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "ruamel.yaml>=0.18",
    "httpx>=0.27",
    "playwright>=1.45",
    "edge-tts>=6.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
creativeforge = "creativeforge.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["creativeforge*"]

[tool.ruff]
line-length = 100
target-version = "py311"
